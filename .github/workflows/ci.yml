name: Continuous Integration & Production Quality Gate

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  audit-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Syntax & Lint Verification
        run: |
          node -c server.js
          node -c config/env.js
          node -c scripts/optimize-images.js

      - name: Run Unit Tests
        run: npm test

      - name: Validate HTML5 & Structured Data
        run: npm run validate
